# Live Momentum Engine - local infrastructure
# Values come from .env (see .env.example); defaults let it run without one.

name: momentum

services:
  # ---------------------------------------------------------------------------
  # Kafka broker + controller in a single node (KRaft mode, no ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"   # for clients running on your Mac (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: momentum-kraft-cluster-01
      # INTERNAL: other containers (kafka:9092) | EXTERNAL: host (localhost:29092)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single node => replication factor 1 for internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # One-shot job: create the events topic (idempotent), then exit
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-live-match-events} \
          --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # ---------------------------------------------------------------------------
  # PostgreSQL sink for aggregated momentum metrics
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momentum_dev}
      POSTGRES_USER: ${POSTGRES_USER:-momentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # PySpark Structured Streaming processor
  # ---------------------------------------------------------------------------
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: spark
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-live-match-events}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-momentum_dev}
      POSTGRES_USER: ${POSTGRES_USER:-momentum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CHECKPOINT_ROOT: /checkpoints
      WINDOW_DURATION: ${WINDOW_DURATION:-5 minutes}
      WINDOW_SLIDE: ${WINDOW_SLIDE:-1 minute}
      WATERMARK: ${WATERMARK:-2 minutes}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-10 seconds}
      W_FINAL_THIRD: ${W_FINAL_THIRD:-1.0}
      W_SHOT: ${W_SHOT:-3.0}
      W_XG: ${W_XG:-5.0}
      W_TACKLE: ${W_TACKLE:-0.5}
    volumes:
      - spark-checkpoints:/checkpoints
      - ./spark:/app/spark:ro
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: ["--master", "local[2]", "/app/spark/jobs/momentum_stream.py"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # PySpark test runner (runs pytest inside container with Java + Spark available)
  # ---------------------------------------------------------------------------
  spark-tests:
    image: momentum-spark
    container_name: spark-tests
    environment:
      APP_ENV: test
      PYTHONPATH: /app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      VIRTUAL_ENV: /opt/venv
      PATH: /opt/venv/bin:/opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./producer:/app/producer:ro
      - ./spark:/app/spark:ro
      - ./tests:/app/tests:ro
    entrypoint: ["/opt/venv/bin/pytest"]
    command: ["-v", "-o", "cache_dir=/tmp/.pytest_cache", "tests"]
    profiles:
      - test

volumes:
  kafka-data:
  pg-data:
  spark-checkpoints:

