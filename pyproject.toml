[project]
name = "live-momentum-engine"
version = "0.1.0"
description = "Real-time soccer momentum pipeline: StatsBomb -> Kafka -> Spark Structured Streaming -> Postgres"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
# Python producer that replays StatsBomb events into Kafka
producer = [
    "statsbombpy>=1.14,<2",
    "confluent-kafka>=2.6,<3",
]
# Runtime extras for the Spark job (the apache/spark image already ships PySpark)
spark = [
    "psycopg2-binary>=2.9,<3",
]
# Local development, linting and tests
dev = [
    "pyspark==3.5.3",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "pre-commit>=4",
    { include-group = "producer" },
    { include-group = "spark" },
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

